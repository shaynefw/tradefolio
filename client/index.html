<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />

    <!-- Primary -->
    <title>Tradefolio — Trading journal &amp; performance analytics</title>
    <meta
      name="description"
      content="Track every trade, visualise your P&amp;L, and review your performance with a clean trading journal built for serious traders."
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, iMessage, Slack, etc.)
         NOTE: image + url are ABSOLUTE — crawlers drop relative image URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tradefolio" />
    <meta property="og:url" content="https://tradefolio-nu.vercel.app/" />
    <meta
      property="og:title"
      content="Tradefolio — Trading journal &amp; performance analytics"
    />
    <meta
      property="og:description"
      content="Track every trade, visualise your P&amp;L, and review your performance with a clean trading journal built for serious traders."
    />
    <meta property="og:image" content="https://tradefolio-nu.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://tradefolio-nu.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tradefolio — Trading journal & performance analytics" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tradefolio — Trading journal &amp; performance analytics" />
    <meta
      name="twitter:description"
      content="Track every trade, visualise your P&amp;L, and review your performance with a clean trading journal built for serious traders."
    />
    <meta name="twitter:image" content="https://tradefolio-nu.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
